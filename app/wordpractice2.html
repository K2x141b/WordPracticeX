<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Practice</title>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="body-grid u-dark-theme">
    
    <div class="menu">
      <button class="menu__back-btn" id="menu__back-btn">╳</button>
      <button class="menu__theme-btn" id="menu__theme-btn">
        dunkel
      </button>
    </div>

    <div class="wl-page" id="wl-page">
    <p class="wl-page__header">Wähle eine Wortliste aus</p>
    <div class="wl-page__div" id="wl-page__div">
      <!-- Rows of clickable word lists will be generated here -->
    </div>
    </div>

    <div class="set-panel" id="set-panel">
      <p>Einstellungen</p>
      <button class="set-panel__btn" id="set-panel__reverse-btn">
        Deutsch → Fremdsprache
      </button>
      <form name="set-panel__form">
        <label for="set-panel__lm-form">Übungs Methode</label><br>
        <select id="set-panel__lm-form" name="cars">
          <option value="WORDS">Wörter</option>
          <option value="ARTICLE">ÜbungArtikel</option>
        </select>
      </form>
    </div>

    <div class="prac-page" id="prac-page">
      <p class="prac-page__q-count" id="prac-page__q-count"></p>

      <p class="prac-page__q-display" id="prac-page__q-display">
        Your question will appear here.
      </p>

      <textarea class="prac-page__txt-input" id="prac-page__txt-input" name="content"
        rows="3" cols="30" autofocus></textarea>
      <p class="prac-page__btn-input" id="prac-page__btn-le">le</p>
      <p class="prac-page__btn-input" id="prac-page__btn-la">la</p>

      <div class="prac-page__fb-disp" id="prac-page__fb-disp">
        <p id="prac-page__fb-A"></p>
        <p id="prac-page__fb-B"></p>
      </div>

      <div id="prac-page__score-disp">
        <h3 class="prac-page__score-txt" id="prac-page__score-txt">Score:</h3>
        <div class="prac-page__score-chart" id="prac-page__score-chart"></div>
      </div>
    </div>

    <script src="app.js" type="module"></script>
  </body>
</html>
